[project]
name = "rail"
version = "0.1.0"
description = "Git workflows for branches, worktrees, checks, PRs, and releases."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["git", "github", "cli", "coding-agents", "automation", "worktrees", "release-automation"]
authors = [
    { name = "Lainess" },
]
dependencies = [
    "Jinja2>=3.1.6",
    "structlog>=26.1.0",
    "filelock>=4.2.4,<5",
    "psutil>=7.2.2,<8",
    "pydantic>=2.14.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.15.20,<1",
    "mypy>=2.1.0,<3",
    "pre-commit>=4.6.0,<5",
    "types-psutil>=7.2.2.20260906,<8",
]

[tool.uv]
package = true

[project.scripts]
"rail" = "rail.entrypoints.cli:run_cli"

[project.urls]
Repository = "https://github.com/lainesss/rail"
Documentation = "https://github.com/lainesss/rail/blob/main/README.md"
Issues = "https://github.com/lainesss/rail/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["rail"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
exclude_also = ["if TYPE_CHECKING:"]

[tool.coverage.paths]
source = [
    "src/rail",
    "*/site-packages/rail",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]
output-format = "concise"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "I",
    "UP",
    "N",
    "C4",
    "SIM",
    "RET",
    "ARG",
    "DTZ",
    "TC",
    "ANN",
    "D",
]
ignore = [
    "E203",
    "D104",
    "D107",
    "D203",
    "D205",
    "D213",
    "DTZ001",
]

[tool.ruff.lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "rail.entrypoints.arguments.CheckoutArguments",
    "rail.application.contracts.FinishInput",
    "rail.application.contracts.ReleaseOptions",
]

[tool.ruff.lint.isort]
known-first-party = ["rail"]
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
exclude = ["^tests/"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rail"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/rail",
    "/tests",
    "/scripts",
    "/pyproject.toml",
    "/README.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/uv.lock",
]
