name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        include:
          - os: windows-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv==0.11.29

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run pre-commit
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' }}
        env:
          SKIP: no-commit-to-branch
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

      - name: Run tests
        run: uv run --no-sync pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Build distributions
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Check installed CLI
        run: uv run --no-sync python scripts/check_cli.py
